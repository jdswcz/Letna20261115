name: Research verification
on:
  push:
    branches: ['main']
    paths-ignore: ['data/collection.json', 'results/estimate.json', 'results/verification.json']
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: letna-research-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Tests
        run: python tools/verify.py
      - name: Calculate current evidence status
        run: python tools/analyze.py
      - name: Audit source and image metadata
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[acquire]'))
        run: python tools/collect.py
      - name: Verify visual-review transport
        run: node tools/review_transport.mjs self-test
      - name: Inventory full galleries
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[acquire]'))
        run: python tools/inventory_galleries.py
      - name: Download official reference map
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[acquire]'))
        run: python tools/download_map.py
      - name: Measure reference geometry
        if: github.event_name == 'push'
        run: python tools/reference_geometry.py
      - name: Download photos and prepare private visual review
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[acquire]'))
        run: |
          python -m pip install cryptography==46.0.3
          python tools/download_for_review.py
      - name: Inspect public video locators
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect-video]')
        run: python tools/inventory_video.py
      - name: Calculate explicit visual scenarios
        run: python tools/quantitative_scenarios.py
      - name: Verify geometric venue capacity
        run: python tools/capacity.py
      - name: Save research outputs
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/persist_results.py
