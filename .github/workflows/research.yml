name: Research verification
on:
  push:
    branches: ['main']
    paths-ignore: ['data/collection.json', 'results/estimate.json', 'results/verification.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: letna-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Tests
        run: python tools/verify.py
      - name: Calculate current evidence status
        run: python tools/analyze.py
      - name: Audit source and image metadata
        if: github.event_name == 'push'
        run: python tools/collect.py
      - name: Inventory full galleries
        if: github.event_name == 'push'
        run: python tools/inventory_galleries.py
      - name: Download official reference map
        if: github.event_name == 'push'
        run: python tools/download_map.py
      - name: Download photos and prepare private visual review
        if: github.event_name == 'push'
        run: |
          python -m pip install cryptography==46.0.3
          python tools/download_for_review.py
      - name: Save metadata to this research branch
        if: github.event_name == 'push'
        env:
          RESEARCH_BRANCH: main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/collection.json results/estimate.json results/verification.json data/download_manifest.json data/gallery_inventory.json maps/
          if ! git diff --cached --quiet; then
            git commit -m "Record HTTP provenance, hashes and image metadata [skip ci]"
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
