name: Research verification
on:
  push:
    branches: ['analysis/2026-11-17-photo-estimate']
    paths-ignore: ['data/collection.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: letna-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
      - name: Audit source and image metadata
        if: github.event_name == 'push'
        run: python tools/collect.py
      - name: Save metadata to this research branch
        if: github.event_name == 'push'
        env:
          RESEARCH_BRANCH: analysis/2026-11-17-photo-estimate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/collection.json
          if ! git diff --cached --quiet; then
            git commit -m "Record HTTP provenance, hashes and image metadata [skip ci]"
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
