name: Quantitative crowd analysis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quantify.yml', 'tools/quantitative*.py', 'data/quantitative*.json']
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: letna-research-main
  cancel-in-progress: false
jobs:
  quantify:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install cryptography==46.0.3 numpy==2.2.6
      - name: Inspect calibrated-scale candidates
        run: python tools/download_for_review.py data/quantitative_review.json
