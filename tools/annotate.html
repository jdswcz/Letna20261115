<!doctype html>
<html lang="cs"><meta charset="utf-8"><title>Letná – ruční anotace</title>
<style>body{font:16px system-ui;margin:24px;max-width:1400px;background:#f5f5f2;color:#17232c}label,button,select{margin:8px}canvas{max-width:100%;height:auto;cursor:crosshair;background:#ddd}input{padding:6px}p{max-width:950px}</style>
<h1>Ruční anotace fotografie</h1>
<p>Otevřete místní fotografii. Nic se nikam neodesílá. Kliknutí označí viditelnou hlavu nebo vrchol polygonu vzorku. Měřítko a plocha se zde neodhadují. Polygon v pixelech vyžaduje samostatnou georeferenci.</p>
<p><input id="file" type="file" accept="image/*"><label>ID zdroje <input id="source"></label>
<label>Čas s pásmem <input id="time" placeholder="2026-11-15T15:00:00+01:00"></label></p>
<p><select id="mode"><option value="heads">Hlavy</option><option value="polygon">Polygon vzorku</option></select>
<button id="undo">Vrátit bod</button><button id="clear">Vymazat</button><button id="save">Export JSON</button>
<span id="count">0 hlav · 0 vrcholů</span></p>
<canvas id="canvas"></canvas>
<script>
"use strict";
const el=id=>document.getElementById(id);
const canvas=el("canvas"),ctx=canvas.getContext("2d");
let img=null,points={heads:[],polygon:[]},filename="",sha256=null;
function draw(){
 if(!img)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);
 const radius=Math.max(2,canvas.width/500);
 ctx.lineWidth=radius/2;
 for(const [kind,list] of Object.entries(points)){
  ctx.strokeStyle=kind==="heads"?"#ff1744":"#00ffb3";
  if(kind==="polygon"&&list.length){ctx.beginPath();ctx.moveTo(...list[0]);for(const p of list.slice(1))ctx.lineTo(...p);if(list.length>2)ctx.closePath();ctx.stroke();}
  for(const p of list){ctx.beginPath();ctx.arc(...p,radius,0,Math.PI*2);ctx.stroke();}
 }
 el("count").textContent=points.heads.length+" hlav · "+points.polygon.length+" vrcholů";
}
el("file").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 filename=f.name;sha256=null;points={heads:[],polygon:[]};
 const bytes=await f.arrayBuffer();
 if(globalThis.crypto?.subtle){const hash=await crypto.subtle.digest("SHA-256",bytes);sha256=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("");}
 const url=URL.createObjectURL(f),next=new Image();
 next.onload=()=>{img=next;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw();URL.revokeObjectURL(url);};
 next.onerror=()=>{URL.revokeObjectURL(url);alert("Obrázek nelze načíst.");};
 next.src=url;
};
canvas.onclick=e=>{
 if(!img)return;const r=canvas.getBoundingClientRect();
 points[el("mode").value].push([(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]);draw();
};
el("undo").onclick=()=>{points[el("mode").value].pop();draw();};
el("clear").onclick=()=>{points={heads:[],polygon:[]};draw();};
el("save").onclick=()=>{
 if(!img||!el("source").value){alert("Načtěte snímek a vyplňte ID zdroje.");return;}
 const data={schema_version:1,source_id:el("source").value,capture_time_claim:el("time").value||null,
 image:{filename,sha256,width:canvas.width,height:canvas.height},pixel_coordinates:points,
 visible_head_count:points.heads.length,ground_area_m2:null,
 note:"Visible heads only; occlusion, perspective, authenticity and sample representativeness need review."};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="annotation.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
</script></html>
